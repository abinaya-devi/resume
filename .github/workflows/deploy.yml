name: Static Site CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint "**/*.html"

      - name: Run Stylelint
        run: |
          npm install -g stylelint stylelint-config-standard
          npx stylelint "**/*.css"

  approval:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          approvers: abinaya-devi
          minimum-approvals: 1
          issue-title: "Deploy approval required"
          issue-body: "Please approve deployment of the static site."
          secret: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
